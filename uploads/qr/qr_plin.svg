<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" rx="20" fill="#00b0e9"/>
  <rect x="20" y="20" width="260" height="260" rx="14" fill="#ffffff"/>
  <!-- Top Left Finder Pattern -->
  <rect x="35" y="35" width="60" height="60" rx="8" fill="#00b0e9"/>
  <rect x="45" y="45" width="40" height="40" rx="4" fill="#ffffff"/>
  <rect x="53" y="53" width="24" height="24" rx="3" fill="#00b0e9"/>
  <!-- Top Right Finder Pattern -->
  <rect x="205" y="35" width="60" height="60" rx="8" fill="#00b0e9"/>
  <rect x="215" y="45" width="40" height="40" rx="4" fill="#ffffff"/>
  <rect x="223" y="53" width="24" height="24" rx="3" fill="#00b0e9"/>
  <!-- Bottom Left Finder Pattern -->
  <rect x="35" y="205" width="60" height="60" rx="8" fill="#00b0e9"/>
  <rect x="45" y="215" width="40" height="40" rx="4" fill="#ffffff"/>
  <rect x="53" y="223" width="24" height="24" rx="3" fill="#00b0e9"/>
  <!-- QR Data Dots & Modules -->
  <g fill="#0b2e4f">
    <rect x="110" y="40" width="12" height="12" rx="2"/>
    <rect x="130" y="40" width="12" height="12" rx="2"/>
    <rect x="160" y="40" width="12" height="12" rx="2"/>
    <rect x="180" y="40" width="12" height="12" rx="2"/>
    <rect x="110" y="60" width="24" height="12" rx="2"/>
    <rect x="150" y="60" width="12" height="24" rx="2"/>
    <rect x="175" y="60" width="18" height="12" rx="2"/>
    <rect x="40" y="110" width="12" height="24" rx="2"/>
    <rect x="65" y="120" width="12" height="12" rx="2"/>
    <rect x="85" y="110" width="24" height="12" rx="2"/>
    <rect x="40" y="150" width="24" height="12" rx="2"/>
    <rect x="75" y="145" width="12" height="24" rx="2"/>
    <rect x="40" y="180" width="12" height="12" rx="2"/>
    <rect x="70" y="180" width="24" height="12" rx="2"/>
    <!-- Center Cluster -->
    <rect x="110" y="110" width="80" height="80" rx="12" fill="#ff4081"/>
    <text x="150" y="158" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">PLIN</text>
    <!-- Right side modules -->
    <rect x="205" y="110" width="15" height="12" rx="2"/>
    <rect x="235" y="110" width="25" height="12" rx="2"/>
    <rect x="205" y="135" width="25" height="12" rx="2"/>
    <rect x="245" y="135" width="15" height="24" rx="2"/>
    <rect x="205" y="165" width="12" height="24" rx="2"/>
    <rect x="230" y="170" width="30" height="12" rx="2"/>
    <!-- Bottom side modules -->
    <rect x="110" y="205" width="25" height="12" rx="2"/>
    <rect x="145" y="205" width="15" height="25" rx="2"/>
    <rect x="175" y="205" width="20" height="12" rx="2"/>
    <rect x="210" y="205" width="12" height="12" rx="2"/>
    <rect x="235" y="205" width="25" height="12" rx="2"/>
    <rect x="110" y="235" width="15" height="25" rx="2"/>
    <rect x="140" y="245" width="30" height="15" rx="2"/>
    <rect x="185" y="235" width="15" height="25" rx="2"/>
    <rect x="215" y="230" width="25" height="15" rx="2"/>
    <rect x="215" y="250" width="45" height="12" rx="2"/>
  </g>
</svg>
